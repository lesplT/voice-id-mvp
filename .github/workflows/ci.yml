name: Container checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check publication manifest
        run: python scripts/check_publish_files.py
      - name: Validate Compose
        run: docker compose -f compose.docker.yml config --quiet
      - name: Build Linux CPU test image
        run: docker build --target test -t voice-id-mvp:test .
      - name: Run tests inside container
        run: docker run --rm voice-id-mvp:test
